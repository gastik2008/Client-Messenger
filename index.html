<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client - Web Messenger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Окно авторизации -->
  <div id="loginWindow" class="window">
    <div class="login-container">
      <h2>🔐 Вход</h2>
      <input type="text" id="username" placeholder="Имя (A-Z, a-z, 0-9)" maxlength="20"/>
      <input type="password" id="password" placeholder="Пароль" maxlength="50"/>
      <button onclick="login()">Войти</button>
      <button onclick="register()">Регистрация</button>
      <p id="authError" class="error"></p>
    </div>
  </div>

  <!-- Окно чата -->
  <div id="chatWindow" class="window hidden">
    <div class="chat-container">
      <!-- Боковая панель: пользователи -->
      <div class="sidebar">
        <h3>👥 Пользователи</h3>
        <div id="userList"></div>
        <button class="small-btn" onclick="switchToGeneral()">💬 Общий чат</button>
      </div>

      <!-- Основная область чата -->
      <div class="main-chat">
        <div id="chatHeader" class="chat-header">💬 Общий чат</div>
        <div id="messages" class="messages-area"></div>

        <!-- Панель ввода -->
        <div class="input-panel">
          <!-- Поле ключа шифрования (скрыто по умолчанию) -->
          <div id="encryptPanel" class="encrypt-panel hidden">
            <input type="text" id="encryptKey" placeholder="🔑 Ключ шифрования (латиница/цифры)" maxlength="32"/>
            <button class="small-btn" onclick="toggleEncrypt()">✕</button>
          </div>

          <!-- Поле ввода + кнопки -->
          <div class="input-row">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)"/>
            <button class="action-btn encrypt-toggle" onclick="toggleEncrypt()" title="Шифрование">🔐</button>
            <button class="action-btn send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

    <script src="app.js"></script>
</body>

</html>
